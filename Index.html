<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Library | Explore Infinite Worlds</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Canvas for Particle Background Animation -->
    <canvas id="particleCanvas"></canvas>

    <!-- Header Navigation -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-book-alchemy animated-logo"></i>
            <span>NEXUS</span>
        </div>
        <nav>
            <a href="#home" class="nav-link active">Home</a>
            <a href="#genres" class="nav-link">Genres</a>
            <a href="#showcase" class="nav-link">Library</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1 class="glow-text">Step Into Wonder</h1>
            <p>Every genre is a gateway to another dimension. Select your path below to unveil hidden knowledge and epic tales.</p>
            <a href="#genres" class="cta-btn">Begin Exploration</a>
        </div>
    </section>

    <!-- Genre Selector Section -->
    <section id="genres" class="genres-section">
        <h2 class="section-title">Select A Domain</h2>
        <div class="genre-grid">
            <button class="genre-card active" data-genre="all">
                <div class="card-icon"><i class="fa-solid fa-infinity"></i></div>
                <h3>All Realms</h3>
            </button>
            <button class="genre-card" data-genre="history">
                <div class="card-icon"><i class="fa-solid fa-hourglass-half"></i></div>
                <h3>History</h3>
            </button>
            <button class="genre-card" data-genre="psychology">
                <div class="card-icon"><i class="fa-solid fa-brain"></i></div>
                <h3>Psychology</h3>
            </button>
            <button class="genre-card" data-genre="literature">
                <div class="card-icon"><i class="fa-solid fa-feather-pointed"></i></div>
                <h3>Literature</h3>
            </button>
            <button class="genre-card" data-genre="scifi">
                <div class="card-icon"><i class="fa-solid fa-user-astronaut"></i></div>
                <h3>Sci-Fi</h3>
            </button>
        </div>
    </section>

    <!-- Book Showcase Grid Section -->
    <section id="showcase" class="showcase-section">
        <div class="books-container" id="booksGrid">
            <!-- Dynamic JavaScript content injects here -->
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Nexus Library. Designed to Inspire Wonder.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
